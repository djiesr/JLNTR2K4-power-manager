name: Build and Publish ESPHome firmware and website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware
    uses: esphome/workflows/.github/workflows/build.yml@2026.10.3
    with:
      files: |
        power-manager-8c-esp8266-d1-mini.yaml
        power-manager-8c-esp32-d1-mini.yaml
      # One manifest for both chips: ESP Web Tools picks the right build
      combined-name: power-manager

  # Same firmware with French entity names, published in fr/
  build-fr:
    name: Build firmware (fr)
    uses: esphome/workflows/.github/workflows/build.yml@2026.10.3
    with:
      files: |
        power-manager-8c-esp8266-d1-mini-fr.yaml
        power-manager-8c-esp32-d1-mini-fr.yaml
      combined-name: power-manager-fr

  publish:
    name: Publish website
    needs: [build, build-fr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      - name: Download firmware
        uses: actions/download-artifact@v8.0.2
        with:
          name: power-manager
          path: firmware

      - name: Download firmware (fr)
        uses: actions/download-artifact@v8.0.2
        with:
          name: power-manager-fr
          path: firmware

      - name: Assemble website
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r static/. site/
          cp firmware/power-manager/"$VERSION"/* site/
          mkdir -p site/fr
          cp firmware/power-manager-fr/"$VERSION"/* site/fr/
          ls -la site site/fr
          grep '"version"' site/manifest.json site/fr/manifest.json

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: site
          clean: true
