  - platform: template
    id: power_a0
    name: $measured_power
    device_id: dev_a0
    unit_of_measurement: 'kW'
    device_class: power
    update_interval: 15s        
    accuracy_decimals: 3
    lambda: |-
      if (id(measured_current_a0).state > 0.03){
        static const float VOLTS[] = {120.0f, 240.0f, 230.0f};
        float volts = VOLTS[id(circuit_voltage_a0).active_index().value_or(0)];
        return (id(measured_current_a0).state * volts / 1000);
      } else {
        return 0.0;
      }
