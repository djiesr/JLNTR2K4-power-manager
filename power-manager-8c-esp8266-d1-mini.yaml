########################################################## CT Clamp #########################################################

  - platform: ct_clamp
    sensor: adc_sensor_a0
    name: $measured_current
    device_id: dev_a0
    update_interval: 15s
    id: measured_current_a0
    accuracy_decimals: 3
    filters:
      - lambda: |-
          static const float RATING[] = {0, 5, 10, 15, 20, 30, 50, 100};
          static const float OUT_V[] = {1.0, 0.5, 0.333};
          float rating = RATING[id(ct_model_a0).active_index().value_or(0)];
          float out_v = OUT_V[id(ct_output_a0).active_index().value_or(0)];
          if (rating == 0 || x <= 0.003f) return 0.0f;
          return (x - 0.003f) * rating / (out_v - 0.003f) * id(ct_correction_a0).state / 100.0f;

