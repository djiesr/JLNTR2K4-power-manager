# These substitutions allow the end user to override certain values
substitutions:
  name: "power-manager"
  # Modify variables if you use multiple boards
  hostname: 'PM'
  # Modify variables based on your circuit, like "breaker 01" or "dryer" 
  ct_clamp_00: 'A0'
  ct_clamp_01: 'A1'
  ct_clamp_02: 'A2'
  ct_clamp_03: 'A3'
  ct_clamp_04: 'A4'
  ct_clamp_05: 'A5'
  ct_clamp_06: 'A6'
  ct_clamp_07: 'A7'
  # Modify variable based on your language
  adc_sensor: 'ADC Sensor'
  measured_current: 'Measured Current'
  measured_power: 'Measured Power'
  measured_total_power_daily: 'Measured Daily Total'
  ct_model: 'CT Model'
  ct_output: 'CT Output'
  ct_none: 'None'
  circuit_voltage: 'Circuit Voltage'
  ct_correction: 'CT Correction'
  

esphome:
  name: "${name}"
  # One Home Assistant device per connector (sensors + CT settings)
  devices:
    - id: dev_a0
      name: "$hostname $ct_clamp_00"
    - id: dev_a1
      name: "$hostname $ct_clamp_01"
    - id: dev_a2
      name: "$hostname $ct_clamp_02"
    - id: dev_a3
      name: "$hostname $ct_clamp_03"
    - id: dev_a4
      name: "$hostname $ct_clamp_04"
    - id: dev_a5
      name: "$hostname $ct_clamp_05"
    - id: dev_a6
      name: "$hostname $ct_clamp_06"
    - id: dev_a7
      name: "$hostname $ct_clamp_07"
  # Automatically add the mac address to the name
  # so you can use a single firmware for all devices
  name_add_mac_suffix: true

  # This will allow for (future) project identification,
  # configuration and updates.
  project:
    name: esphome.power-manager
    version: "6.6.0"

esp8266:
  board: d1_mini
  # Keep CT settings and daily totals through a power loss
  # (by default the ESP8266 only keeps them in RTC memory).
  restore_from_flash: true

preferences:
  # Write settings to flash at most every 5 min to limit wear
  flash_write_interval: 5min

# To be able to get logs from the device via serial and api.
logger:

# API is a requirement of the dashboard import.
api:

# OTA is required for Over-the-Air updating
ota:

# This should point to the public location of this yaml file.
dashboard_import:
  package_import_url: github://djiesr/JLNTR2K4-power-manager/power-manager-8c-esp8266-d1-mini.yaml@main

wifi:
  # Set up a wifi access point using the device name above
  ap:
    password: "12345678"

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device.
captive_portal:

# Sets up the improv via serial client for Wi-Fi provisioning.
# Handy if your device has a usb port for the user to add credentials when they first get it.
improv_serial:

##########################################################

web_server:
  port: 80

text_sensor:
  - platform: wifi_info
    ip_address:
      name: $hostname ESP IP Address
      entity_category: diagnostic
      disabled_by_default: true
      id: ip_now
    ssid:
      name: $hostname ESP Connected SSID
      entity_category: diagnostic
      disabled_by_default: true
    bssid:
      name: $hostname ESP Connected BSSID
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: $hostname ESP Mac Wifi Address
      entity_category: diagnostic
      disabled_by_default: true
    scan_results:
      name: $hostname ESP Latest Scan Results
      entity_category: diagnostic
      disabled_by_default: true

i2c:
  sda: D2
  scl: D1
  scan: false


interval:
  - interval: 5s
    then:
      - display.page.show_next: ic2_screen
      - component.update: ic2_screen

display:
  - platform: ssd1306_i2c
    id: ic2_screen
    model: "SSD1306 128x64"
    reset_pin: D0
    address: 0x3C
    pages:
      - id: page1
        lambda: |-
          it.printf(10, 0, id(font_times), "Power Manager");
          it.printf(10, 15, id(font_times), "JLNTR2k4 2022.4");
#          it.printf(10, 30, id(font_times), "Main: %.1f kW", id(power_total).state);    
#          it.printf(10, 45, id(font_times), "IP: %s", id(ip_now).state.c_str()); 
      - id: page2
        lambda: |-
          it.printf(10, 0, id(font_times), "Get A0: %.3f V", id(adc_sensor_a0).state);
          it.printf(10, 15, id(font_times), "A0: %.2f Amp", id(measured_current_a0).state);
          it.printf(10, 30, id(font_times), "Power %.3f kW", id(power_a0).state);
